[project]
name = "ocr-service"
version = "0.1.0"
description = "Local PP-OCRv6 (MLX) service that mimics the PaddleOCR cloud job API for UniReader"
requires-python = ">=3.12"
dependencies = [
    "mlx4ocr",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

# 钉死 fork 的提交；调试 fork 时可临时改成 { path = "../mlx4ocr", editable = true }
[tool.uv.sources]
mlx4ocr = { git = "https://github.com/xVanTuring/mlx4ocr", rev = "090c981f9866960335fe151907bbf0cbadf68655" }

[project.scripts]
ocr-service = "ocr_service.app:main"

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ocr_service"

[tool.pytest.ini_options]
testpaths = ["tests"]
